# Sentinel X -- consolidated stack (CONTRACT.md, step 3 deliverable)
#
# One entry point: `docker compose up -d` from the repository root builds and
# boots SupportDesk + Prometheus + Grafana + Wazuh.
#
# WARNING (same as supportdesk/docker-compose.yml): the full stack needs
# 8-12 GB of available RAM; the Wazuh indexer (OpenSearch) alone wants ~4 GB
# heap, and Wazuh takes 5-15 minutes to become fully operational on first
# start. `sudo sysctl -w vm.max_map_count=262144` is required on Linux hosts.
#
# Composition:
#   - `include` keeps the app and Wazuh compose files authoritative for their
#     own services (same `sentinelx` project name, same default network, so
#     `supportdesk`, `prometheus` and `wazuh.*` hostnames resolve on it).
#   - Prometheus scrapes `supportdesk:3000/metrics` (monitoring/prometheus.yml,
#     W3-02). Grafana serves the provisioned "SupportDesk" dashboards
#     (monitoring/grafana, W3-03). Ports: app 3000, Prometheus 9090,
#     Grafana 3001, Wazuh dashboard 443.
#   - Detection stays Wazuh's business: no alerting rules live here.

name: sentinelx

include:
  - supportdesk/docker-compose.yml
  - detection/wazuh/docker-compose.wazuh.yml

services:
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"