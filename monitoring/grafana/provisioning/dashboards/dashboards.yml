apiVersion: 1

# Dashboard file provider: loads every JSON under grafana/dashboards/
# (mounted read-only at /var/lib/grafana/dashboards by the compose).
providers:
  - name: sentinelx
    orgId: 1
    folder: "Sentinel X"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 15
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false